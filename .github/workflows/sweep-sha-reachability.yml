name: sweep-sha-reachability

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  reachability:
    name: sweep-sha-reachability
    runs-on: ubuntu-latest
    steps:
      - name: Scope gate
        id: scope
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REF" == claude/sweep-* || "$HEAD_REF" == claude/prose-* ]]; then
            echo "family=updater" >> "$GITHUB_OUTPUT"
            echo "In scope: head ref is $HEAD_REF" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "family=other" >> "$GITHUB_OUTPUT"
            echo "Branch-independent changed-provenance scan: $HEAD_REF" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanner dependencies
        # Pinned literally rather than installed from scripts/requirements.txt:
        # the requirements file is PR-controlled and could be swapped for a
        # hostile package on a malicious sweep PR. Workflow YAMLs require
        # repo-admin permissions to modify, so this pin lives at a trust
        # boundary the guard does not need to validate.
        run: pip install 'PyYAML>=6,<7'

      - name: Validate SHA reachability
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          import yaml

          BASE = os.environ["BASE_SHA"]
          HEAD = os.environ["HEAD_SHA"]
          TOKEN = os.environ["GITHUB_TOKEN"]
          SUMMARY_PATH = os.environ.get("GITHUB_STEP_SUMMARY")
          REGISTRY_PATH = "repo-registry.yml"
          MANIFEST_PATH = "target-manifest.yml"
          DOCS_PREFIX = "docs/"
          VERIFICATION_BLOCK_RE = re.compile(
              r"<!--\s*verification:(.*?)-->", re.DOTALL
          )
          KEY_VALUE_RE = re.compile(r"^\s*([a-z_]+)\s*:\s*(\S.*?)\s*$")

          violations: list[str] = []
          validated_release_tags: list[str] = []

          def fail(loc: str, msg: str) -> None:
              violations.append(f"{loc}: {msg}")

          def show(ref: str, path: str) -> str | None:
              try:
                  return subprocess.check_output(
                      ["git", "show", f"{ref}:{path}"],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
              except subprocess.CalledProcessError:
                  return None

          def github_get(path: str) -> tuple[int, dict | None]:
              url = f"https://api.github.com{path}"
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {TOKEN}",
                      "User-Agent": "autonomi-developer-docs-sweep-sha-reach",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.status, json.loads(resp.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  return exc.code, None
              except urllib.error.URLError as exc:
                  fail(url, f"GitHub API network error: {exc.reason}")
                  return -1, None

          def parse_owner_repo(url: str) -> tuple[str, str] | None:
              parsed = urllib.parse.urlparse(url)
              parts = [p for p in parsed.path.strip("/").split("/") if p]
              if parsed.netloc != "github.com" or len(parts) < 2:
                  return None
              owner, repo = parts[0], parts[1]
              if repo.endswith(".git"):
                  repo = repo[: -len(".git")]
              return owner, repo

          def load_registry() -> dict:
              text = show(HEAD, REGISTRY_PATH) or ""
              try:
                  data = yaml.safe_load(text) or {}
              except yaml.YAMLError as exc:
                  fail(REGISTRY_PATH, f"YAML parse error: {exc}")
                  return {}
              return (data or {}).get("repos") or {}

          REGISTRY = load_registry()

          def load_release_entries() -> dict:
              text = show(HEAD, MANIFEST_PATH) or ""
              try:
                  data = yaml.safe_load(text) or {}
              except yaml.YAMLError as exc:
                  fail(MANIFEST_PATH, f"YAML parse error: {exc}")
                  return {}
              release = data.get("release_baselines") or {}
              entries = release.get("entries") or {} if isinstance(release, dict) else {}
              if not isinstance(entries, dict):
                  fail(MANIFEST_PATH, "release_baselines.entries must be a map")
                  return {}
              return entries

          RELEASE_ENTRIES = load_release_entries()

          def validate_sha(
              loc: str, repo_key: str, ref: str, sha: str
          ) -> None:
              if not isinstance(sha, str) or not sha:
                  fail(
                      loc,
                      "recorded SHA is not a non-empty string: "
                      f"{sha!r}",
                  )
                  return
              entry = REGISTRY.get(repo_key)
              if not entry:
                  fail(loc, f"repo not in repo-registry.yml: {repo_key}")
                  return
              parsed = parse_owner_repo(entry["url"])
              if not parsed:
                  fail(loc, f"unparseable url: {entry['url']}")
                  return
              owner, repo = parsed
              status, _ = github_get(f"/repos/{owner}/{repo}/commits/{sha}")
              if status != 200:
                  fail(
                      loc,
                      f"{repo_key}@{sha[:7]} not reachable on github.com "
                      f"(GET /commits/{sha} -> {status})",
                  )
                  return
              encoded_ref = urllib.parse.quote(ref, safe="")
              compare_status, body = github_get(
                  f"/repos/{owner}/{repo}/compare/{sha}...{encoded_ref}"
              )
              if compare_status != 200 or not body:
                  fail(
                      loc,
                      f"{repo_key}: compare {sha[:7]}...{ref} returned "
                      f"{compare_status}",
                  )
                  return
              compare_state = body.get("status")
              if compare_state not in ("ahead", "identical"):
                  fail(
                      loc,
                      f"{repo_key}: recorded SHA {sha[:7]} is not an "
                      f"ancestor of {ref} (compare status: {compare_state}); "
                      "force-push or ref-rewrite suspected",
                  )

          def validate_release_tag(
              loc: str, path: str, repo_key: str, tag: str, sha: str
          ) -> None:
              matches = []
              for entry_key, entry in RELEASE_ENTRIES.items():
                  if not isinstance(entry, dict) or not isinstance(entry.get("source"), dict):
                      continue
                  source = entry["source"]
                  if (
                      path in entry.get("scoped_pages", [])
                      and source.get("repo") == repo_key
                      and source.get("tag") == tag
                      and source.get("commit") == sha
                  ):
                      matches.append(entry_key)
              if len(matches) != 1:
                  fail(
                      loc,
                      "changed target-manifest block must correspond to exactly "
                      "one release baseline entry",
                  )
                  return
              entry = REGISTRY.get(repo_key)
              if not entry:
                  fail(loc, f"repo not in repo-registry.yml: {repo_key}")
                  return
              parsed = parse_owner_repo(entry["url"])
              if not parsed:
                  fail(loc, f"unparseable url: {entry['url']}")
                  return
              owner, repo = parsed
              encoded_tag = urllib.parse.quote(tag, safe="")
              status, body = github_get(
                  f"/repos/{owner}/{repo}/git/ref/tags/{encoded_tag}"
              )
              if status != 200 or not isinstance(body, dict) or not isinstance(body.get("object"), dict):
                  fail(loc, f"release tag {tag!r} could not be resolved exactly")
                  return
              target = body["object"]
              seen = set()
              while True:
                  target_type = target.get("type")
                  target_sha = target.get("sha")
                  if not isinstance(target_sha, str) or not re.fullmatch(r"[0-9a-f]{40}", target_sha):
                      fail(loc, f"release tag {tag!r} has malformed target metadata")
                      return
                  if target_type == "commit":
                      if target_sha != sha:
                          fail(
                              loc,
                              f"release tag {tag!r} peels to {target_sha}, not recorded commit {sha}",
                          )
                          return
                      validated_release_tags.append(f"{loc}: {tag} -> {sha}")
                      return
                  if target_type != "tag" or target_sha in seen:
                      fail(loc, f"release tag {tag!r} does not peel to a commit")
                      return
                  seen.add(target_sha)
                  status, tag_object = github_get(
                      f"/repos/{owner}/{repo}/git/tags/{target_sha}"
                  )
                  if (
                      status != 200
                      or not isinstance(tag_object, dict)
                      or not isinstance(tag_object.get("object"), dict)
                  ):
                      fail(loc, f"annotated release tag {tag!r} could not be peeled")
                      return
                  target = tag_object["object"]

          def parse_block_fields(body: str) -> dict[str, str]:
              fields: dict[str, str] = {}
              for raw_line in body.splitlines():
                  match = KEY_VALUE_RE.match(raw_line.strip())
                  if match:
                      fields[match.group(1)] = match.group(2)
              return fields

          def line_of_offset(text: str, offset: int) -> int:
              return text.count("\n", 0, offset) + 1

          def block_intervals(text: str) -> list[tuple[int, int, str]]:
              # (start_line, end_line, body) for each block
              out: list[tuple[int, int, str]] = []
              for match in VERIFICATION_BLOCK_RE.finditer(text):
                  start_line = line_of_offset(text, match.start())
                  end_line = line_of_offset(text, match.end())
                  out.append((start_line, end_line, match.group(1)))
              return out

          # Identify changed verification blocks: any block in HEAD whose
          # content (full match text) differs from any block in BASE that
          # spans the same lines, OR that has no exact match in BASE.
          def changed_blocks_in_doc(
              base_text: str, head_text: str
          ) -> list[tuple[int, str]]:
              base_block_set = {
                  match.group(0) for match in VERIFICATION_BLOCK_RE.finditer(base_text)
              }
              changed: list[tuple[int, str]] = []
              for match in VERIFICATION_BLOCK_RE.finditer(head_text):
                  if match.group(0) in base_block_set:
                      continue
                  changed.append(
                      (line_of_offset(head_text, match.start()), match.group(1))
                  )
              return changed

          # 1) docs/**/*.md changed verification blocks
          name_status = subprocess.check_output(
              ["git", "diff", "--name-status", "-z", f"{BASE}..{HEAD}"],
              text=True,
          )
          tokens = [t for t in name_status.split("\0") if t]
          changed_paths: list[str] = []
          i = 0
          while i < len(tokens):
              status = tokens[i]
              if status.startswith(("R", "C")):
                  if i + 2 < len(tokens):
                      changed_paths.append(tokens[i + 2])
                  i += 3
              else:
                  if i + 1 < len(tokens):
                      changed_paths.append(tokens[i + 1])
                  i += 2

          docs_changed = [
              p for p in changed_paths if p.startswith(DOCS_PREFIX) and p.endswith(".md")
          ]

          for path in sorted(set(docs_changed)):
              base_text = show(BASE, path) or ""
              head_text = show(HEAD, path) or ""
              for start_line, body in changed_blocks_in_doc(base_text, head_text):
                  fields = parse_block_fields(body)
                  loc = f"{path}:{start_line}"
                  required = ("source_repo", "source_ref", "source_commit")
                  if any(k not in fields for k in required):
                      fail(loc, "verification block missing required keys")
                      continue
                  if fields.get("verification_mode") == "target-manifest":
                      validate_release_tag(
                          loc,
                          path,
                          fields["source_repo"],
                          fields["source_ref"],
                          fields["source_commit"],
                      )
                      continue
                  validate_sha(
                      loc,
                      fields["source_repo"],
                      fields["source_ref"],
                      fields["source_commit"],
                  )

          if violations:
              if SUMMARY_PATH:
                  with open(SUMMARY_PATH, "a", encoding="utf-8") as out:
                      out.write("## sweep-sha-reachability failures\n\n")
                      for v in violations:
                          out.write(f"- `{v}`\n")
                      if validated_release_tags:
                          out.write("\n## exact release tags validated\n\n")
                          for note in validated_release_tags:
                              out.write(f"- `{note}`\n")
              for v in violations:
                  print(v, file=sys.stderr)
              sys.exit(1)

          if SUMMARY_PATH:
              with open(SUMMARY_PATH, "a", encoding="utf-8") as out:
                  out.write("sweep-sha-reachability: all SHAs reachable.\n")
                  if validated_release_tags:
                      out.write("\n## exact release tags validated\n\n")
                      for note in validated_release_tags:
                          out.write(f"- `{note}`\n")
          PY
